<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Pulse Line Gradient -->
    <linearGradient id="orgPulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Subtle glow for small icon -->
    <filter id="orgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="32" height="32" rx="7" fill="#090d16" />

  <!-- Background Indicator Bars -->
  <rect x="7" y="10" width="3" height="15" rx="1.2" fill="#334155" opacity="0.7" />
  <rect x="12" y="6" width="3.2" height="19" rx="1.2" fill="#475569" opacity="0.6" />
  <rect x="17.2" y="13" width="3" height="12" rx="1.2" fill="#334155" opacity="0.7" />
  <rect x="22.2" y="8" width="3" height="17" rx="1.2" fill="#475569" opacity="0.6" />

  <!-- High-Contrast Telemetry Pulse Line -->
  <path d="M 2 17 L 7 17 L 10 7 L 14 24 L 18 12 L 22 17 L 27 17"
        fill="none"
        stroke="url(#orgPulse)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#orgGlow)" />

  <!-- Terminal Sensor Node Dot -->
  <circle cx="27" cy="17" r="1.8" fill="#fbbf24" filter="url(#orgGlow)" />
</svg>
